name: Temporary Homepage Motion Text Repair

on:
  push:
    branches:
      - improve/phase-2-home-motion-lazy

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Repair text and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path("app/HomePageClient.tsx")
          source = path.read_text()
          broken = '"Drawings, reviews, and project coordination are in m.",'
          fixed = '"Drawings, reviews, and project coordination are in motion.",'
          if broken not in source:
              raise SystemExit("Expected text repair target was not found")
          path.write_text(source.replace(broken, fixed, 1))
          PY

          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/lighthouse-production.yml > .github/workflows/lighthouse-production.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/HomePageClient.tsx .github/workflows/lighthouse-production.yml
          git commit -m "Fix homepage motion copy after refactor"
          git push origin HEAD:${{ github.ref_name }}
