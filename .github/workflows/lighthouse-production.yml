name: Temporary Homepage Motion Refactor

on:
  push:
    branches:
      - improve/phase-2-home-motion-lazy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply lightweight Framer Motion path
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          page = Path("app/HomePageClient.tsx")
          source = page.read_text()

          old_import = 'import { motion } from "framer-motion";'
          new_import = 'import { LazyMotion, m } from "framer-motion";'
          if old_import not in source:
              raise SystemExit("Expected Framer Motion import was not found")
          source = source.replace(old_import, new_import, 1)

          type_import = 'import type { HomePageContent } from "@/sanity/types/siteContent";\n'
          loader = '''import type { HomePageContent } from "@/sanity/types/siteContent";\n\nconst loadHomeMotionFeatures = () =>\n  import("./components/homeMotionFeatures").then((module) => module.default);\n'''
          if type_import not in source:
              raise SystemExit("Expected HomePageContent import was not found")
          source = source.replace(type_import, loader, 1)

          source = source.replace("motion.", "m.")

          marker = "export default function HomePageClient"
          before, sep, after = source.partition(marker)
          if not sep:
              raise SystemExit("HomePageClient export was not found")

          opening = '  return (\n    <div style={{ background: "#050505", color: "white", overflow: "hidden" }}>'
          wrapped_opening = '  return (\n    <LazyMotion features={loadHomeMotionFeatures} strict>\n      <div style={{ background: "#050505", color: "white", overflow: "hidden" }}>'
          if opening not in after:
              raise SystemExit("HomePageClient root opening was not found")
          after = after.replace(opening, wrapped_opening, 1)

          ending = '      </div>\n    </div>\n  );\n}\n'
          wrapped_ending = '      </div>\n    </div>\n    </LazyMotion>\n  );\n}\n'
          if not after.endswith(ending):
              raise SystemExit("HomePageClient root ending was not found")
          after = after[:-len(ending)] + wrapped_ending
          source = before + sep + after

          page.write_text(source)

          feature_file = Path("app/components/homeMotionFeatures.ts")
          feature_file.write_text(
              'import { domAnimation } from "framer-motion";\n\nexport default domAnimation;\n'
          )
          PY

          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/lighthouse-production.yml > .github/workflows/lighthouse-production.yml

          git diff --check
          grep -q 'import { LazyMotion, m } from "framer-motion";' app/HomePageClient.tsx
          grep -q '<LazyMotion features={loadHomeMotionFeatures} strict>' app/HomePageClient.tsx
          ! grep -q 'motion\.' app/HomePageClient.tsx

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/HomePageClient.tsx app/components/homeMotionFeatures.ts .github/workflows/lighthouse-production.yml
          git commit -m "Phase 2: lazy-load homepage motion features"
          git push origin HEAD:${{ github.ref_name }}
