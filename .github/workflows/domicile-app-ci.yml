name: DŌMICILE App CI

on:
  pull_request:
    paths:
      - "domicile-app/**"
      - ".github/workflows/domicile-app-ci.yml"

concurrency:
  group: domicile-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domicile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type and production build
        env:
          NEXT_PUBLIC_ENABLE_DEMO_MODE: "true"
        run: npm run build
